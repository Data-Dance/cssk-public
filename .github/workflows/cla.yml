# Generated into this repository by tools/generate_distribution.py.
# Edit it in the source repository, not here.
#
# Before this repository goes public it needs, IN THIS REPOSITORY:
#   1. a branch `cla-signatures` (unprotected), and
#   2. a secret CLA_SIGNATURES_TOKEN, a token with Contents:
#      read/write here. The default GITHUB_TOKEN cannot write to a
#      branch from a pull_request_target run.
# Without both, every pull request fails this check with
# 'Branch cla-signatures not found' before it ever reads the
# allowlist. That is why the source repository's copy was disabled.

# Contributor Licence Agreement gate.
#
# Blocks a pull request until every commit author on it has signed the CLA.
# Signatures are stored in THIS repository (branch `cla-signatures`), not on a
# third-party service, so the record stays with us.
#
# Before enabling:
#   1. Create the `cla-signatures` branch (it may be empty).
#   2. Create a fine-grained PAT with Contents: read/write on this repository
#      and store it as the secret CLA_SIGNATURES_TOKEN. The default
#      GITHUB_TOKEN cannot write to a branch from a pull_request_target run.
#   3. Add "CLA Assistant" as a required status check on the protected branches
#      so an unsigned pull request cannot be merged even by an administrator.
#
# Note the `pull_request_target` trigger: it runs the workflow from the BASE
# branch with repository write access, which is what lets a fork's pull request
# be recorded. It must therefore never check out or execute the fork's code.
# This workflow does neither — it only runs the action below.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the CLA signature
        if: >
          (github.event.comment.body == 'I have read the Contributor Licence Agreement and I hereby sign it.')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Data-Dance/cssk-public/blob/19.0/cla/ICLA.md
          custom-pr-sign-comment: I have read the Contributor Licence Agreement and I hereby sign it.
          custom-notsigned-prcomment: |
            Thank you for this pull request.

            Before we can merge it, we need a signed Contributor Licence
            Agreement from every commit author on the branch. It takes about a
            minute and covers all your future contributions to this repository.

            Please read the [Individual CLA](https://github.com/Data-Dance/cssk-public/blob/19.0/cla/ICLA.md),
            then post the sentence below as a new comment on this pull request:
          custom-allsigned-prcomment: |
            All commit authors have signed the CLA. Thank you — this pull
            request is clear to review.
          # Maintainers and bots do not sign. Anyone added here bypasses the
          # gate entirely, so keep this list to accounts whose contributions are
          # already covered by ownership or by an employment relationship.
          allowlist: Rad0van,dependabot[bot],renovate[bot]
          # A contributor who signs the Corporate CLA on paper is recorded by a
          # maintainer adding them to signatures/cla.json directly.
          lock-pullrequest-aftermerge: false
